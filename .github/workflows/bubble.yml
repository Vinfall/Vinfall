name: Build

permissions: {}

on:
  schedule:
    - cron: 0 18 * * * # 2:00 UTC+8 everyday
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write # required to push
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      filename: bubble.svg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: output
          persist-credentials: true
          fetch-depth: 2

      - name: setup
        id: setup-mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true
          cache_key_prefix: "nightly"
          tool_versions: |
            node lts

      - name: generate
        run: npx pacman-contribution-graph --game puzzle-bobble --username ${{ github.repository_owner }} --platform github --gameTheme github-dark --output "${filename}"

      - name: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit --amend --no-edit
          git push origin output --force
